<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Squada+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amaranth&family=Squada+One&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background-color: #ffffff;
      overflow-y: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-section {
      background: linear-gradient(-45deg, #fffaf1 0%, #ffe5ad 25%, white 50%, #f7e4c0 75%);
      background-size: 300% 300%;
      animation: gradientBG 13s ease infinite;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 150px 60px;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .text-group {
      margin-left: 10px;
    }

    .hello-text {
      color: #ea7a80;
      font-size: 150px;
      font-weight: bold;
      font-family: 'Squada One', Segoe UI;
      text-transform: uppercase;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      animation: typing 1.5s steps(8, end) forwards;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    .welcome-text {
      overflow: hidden;
      font-family: 'Pacifico', cursive;
      font-size: 100px;
      color: #fea997;
      margin-left: 50px;
      white-space: nowrap;
      margin-bottom: 30px;
      width: 0;
      animation: cursive-write 3s steps(30) 1s forwards;
    }

    @keyframes cursive-write {
      0% { width: 0; }
      100% { width: 100%; }
    }

    .explore-button {
      margin-left: 200px;
      padding: 12px 50px;
      border: 3px solid #91a6ce;
      border-radius: 25px;
      background-color: #f2f8fc;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      color: #ef5e5e;
      font-family: 'Amaranth', sans-serif;
      text-decoration: none;
    }

    .explore-button:hover {
      background-color: #ea7a80;
      color: #f2f8fc;
      border-color: #91a6ce;
    }

    .vertical-names {
      position: absolute;
      top: 20px;
      right: 40px;
      display: flex;
      gap: 40px;
    }

    .name-wrapper {
      position: relative;
      opacity: 0;
      transform: translateY(-50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .name-wrapper.animate { animation: dropIn 0.6s ease forwards; }
    .name-wrapper:nth-child(1).animate { animation-delay: 0.1s; }
    .name-wrapper:nth-child(2).animate { animation-delay: 0.2s; }
    .name-wrapper:nth-child(3).animate { animation-delay: 0.3s; }
    .name-wrapper:nth-child(4).animate { animation-delay: 0.4s; }
    .name-wrapper:nth-child(5).animate { animation-delay: 0.5s; }

    @keyframes dropIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .vertical-name {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 20px;
      font-weight: bold;
      color: #879073;
      text-transform: uppercase;
      font-family: 'Segoe UI', sans-serif;
      padding: 0px 10px;
    }

    .highlight .vertical-name {
      font-weight: bold;
      color: #ea7a80;
      margin-top: 40px;
    }

    .name-wrapper .line {
      position: absolute;
      right: calc(100% + 18px);
      top: -20px;
      height: 2000px;
      width: 4px;
      background-color: #91a6ce;
    }

    .arrow-up, .arrow-down {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background-color: #91a6ce;
      color: #ffe5ad;
      border: 3px solid #bed3e1;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      animation: pulse 2s ease infinite;
      z-index: 2;
    }

    .arrow-up {
      bottom: 20px;
    }

    .arrow-down {
      top: -90px;
    }

    .arrow-up:hover, .arrow-down:hover {
      background-color: #ea7a80;
      color: #f2f8fc;
    }

    .container.bottom-visible .arrow-up {
      display: none;
    }

    .container .arrow-up {
      display: flex;
    }

    .container.bottom-visible .arrow-down {
      display: flex;
    }

    .container .arrow-down {
      display: none;
    }

    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .bottom-section {
      background-color: #cfe2f0;
      border-top: 4px solid #bed3e1;
      text-align: center;
      padding: 40px 20px;
      position: absolute;
      bottom: 0;
      width: 100%;
      opacity: 0;
      transform: translateY(100%);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .container.bottom-visible .bottom-section {
      opacity: 1;
      transform: translateY(0);
    }

    .team-title {
      background-color: #91a6ce;
      border: 4px solid #bed3e1;
      color: #ffe5ad;
      font-weight: bold;
      padding: 5px 160px;
      border-radius: 50px;
      font-size: 35px;
      display: inline-block;
      margin: 0 auto 30px auto;
      font-family: 'Amaranth', sans-serif;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .team {
      display: flex;
      justify-content: center;
      gap: 90px;
      flex-wrap: wrap;
      padding-top: 40px;
    }

    .member {
      text-align: center;
      position: relative;
    }

    .cloud-shape,
    .cloud-shapes {
      position: relative;
      width: 200px;
      height: 200px;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cloud-shape {
      border: 4px solid #ffe5ad;
      border-radius: 23% 77% 69% 31% / 39% 24% 76% 61%;
    }

    .cloud-shapes {
      border: 4px solid #91a6ce;
      border-radius: 73% 27% 29% 71% / 34% 34% 66% 66%;
    }

    .cloud-shape img,
    .cloud-shapes img {
      width: 100%;
      height: 100%;
    }

    .member-name {
      margin-top: 10px;
      font-family: 'Pacifico', cursive;
      font-size: 25px;
    }

    .red-name {
      color: #ea7a80;
    }

    .blue-name {
      color: #879073;
    }

    @media (max-width: 768px) {
      .top-section {
        flex-direction: column;
        padding: 30px 20px;
        align-items: flex-start;
      }

      .vertical-names {
        position: static;
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .bottom-section {
        padding: 30px 15px;
      }

      .team {
        gap: 20px;
      }

      .hello-text {
        font-size: 60px;
      }

      .welcome-text {
        font-size: 45px;
      }

      .explore-button {
        font-size: 14px;
      }

      .team-title {
        font-size: 16px;
        padding: 10px 25px;
      }

      .arrow-up, .arrow-down {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .arrow-down {
        top: -60px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-section">
      <div class="text-group">
        <div class="hello-text">ARTS & CRAFTS</div>
        <div class="welcome-text">By Uno + 1</div>
        <a href="2.html" class="explore-button">Explore!</a>
      </div>

      <div class="vertical-names">
        <div class="name-wrapper highlight">
          <div class="vertical-name">paz</div>
          <div class="line" style="height: 200px;"></div>
        </div>
        <div class="name-wrapper">
          <div class="vertical-name" style="padding-top: 70px;">tuazon</div>
          <div class="line" style="height: 300px"></div>
        </div>
        <div class="name-wrapper highlight">
          <div class="vertical-name" style="padding-top: 140px;">mendoza</div>
          <div class="line" style="height: 400px;"></div>
        </div>
        <div class="name-wrapper">
          <div class="vertical-name" style="padding-top: 210px;">bolante</div>
          <div class="line" style="height: 500px;"></div>
        </div>
        <div class="name-wrapper highlight">
          <div class="vertical-name" style="padding-top: 280px;">tolentino</div>
          <div class="line" style="height: 600px;"></div>
        </div>
      </div>
      <button class="arrow-up">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
    </div>

    <div class="bottom-section">
      <button class="arrow-down">
        <i class="fa-solid fa-chevron-down"></i>
      </button>
      <button class="team-title">Meet the Creatives</button>
      <div class="team">
        <div class="member">
          <div class="cloud-shape">
            <img src="https://i.imgur.com/v7kIxzO.jpeg" style="height: 205px;" alt="Zed">
          </div>
          <div class="member-name red-name">Zed</div>
        </div>
        <div class="member">
          <div class="cloud-shapes">
            <img src="https://i.imgur.com/k1AoIPD.jpeg" style="height: 210px;" alt="Dave">
          </div>
          <div class="member-name blue-name">Dave</div>
        </div>
        <div class="member">
          <div class="cloud-shape">
            <img src="https://i.imgur.com/Ht3slUE.jpeg" alt="Thea">
          </div>
          <div class="member-name red-name">Thea</div>
        </div>
        <div class="member">
          <div class="cloud-shapes">
            <img src="#" alt="Drids">
          </div>
          <div class="member-name blue-name">Drids</div>
        </div>
        <div class="member">
          <div class="cloud-shape">
            <img src="https://i.imgur.com/f7YlOwH.png" alt="Yapi">
          </div>
          <div class="member-name red-name">Yapi</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const wrappers = document.querySelectorAll('.name-wrapper');
      wrappers.forEach((wrapper) => {
        wrapper.classList.add('animate');
      });

      const arrowUp = document.querySelector('.arrow-up');
      const arrowDown = document.querySelector('.arrow-down');
      const container = document.querySelector('.container');

      const toggleBottomSection = () => {
        container.classList.toggle('bottom-visible');
      };

      arrowUp.addEventListener('click', toggleBottomSection);
      arrowDown.addEventListener('click', toggleBottomSection);
    });
  </script>
</body>
</html>
