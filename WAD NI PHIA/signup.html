<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Squada+One&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
    }

    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #fff3e0, #ffd7a7, #f8e1e9, #f7e4c0);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .signup {
      background: rgba(255, 255, 255, 0.95);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 380px;
      transition: transform 0.3s ease;
    }

    .signup:hover {
      transform: translateY(-3px);
    }

    .signup h1 {
      color: #ea7a80;
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      font-family: 'Squada One', sans-serif;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .infos {
      display: grid;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .infos .namein {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #ea7a80;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .infos i {
      color: #ea7a80;
      font-size: 1rem;
    }

    .infos input {
      width: 100%;
      height: 36px;
      border-radius: 20px;
      border: 1px solid #ced4da;
      background: #f1f3f5;
      padding: 0 0.8rem;
      font-size: 0.9rem;
      color: #343a40;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .infos input:focus {
      outline: none;
      border-color: #ea7a80;
      box-shadow: 0 0 6px rgba(230, 57, 70, 0.3);
    }

    .infos input::placeholder {
      color: #adb5bd;
    }

    .terms {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: #495057;
    }

    .terms a {
      color: #ea7a80;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .terms a:hover {
      color: #d00000;
    }

    .signupbutton {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .signupbutton button {
      padding: 0.6rem 1.5rem;
      border: 2px solid #ea7a80;
      border-radius: 20px;
      background-color: #ea7a80;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Segoe UI', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signupbutton button:hover {
      background-color: #fff;
      color: #ea7a80;
      transform: translateY(-2px);
    }

    .signupbutton button#cancelBtn {
      background-color: transparent;
      color: #ea7a80;
    }

    .signupbutton button#cancelBtn:hover {
      background-color: #ea7a80;
      color: #fff;
    }

    .loginlink {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #495057;
    }

    .loginlink a {
      color: #ea7a80;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .loginlink a:hover {
      color: #d00000;
    }

    @media (max-width: 480px) {
      .signup {
        padding: 1.2rem;
        max-width: 90%;
      }

      .signup h1 {
        font-size: 1.8rem;
      }

      .signupbutton {
        flex-direction: column;
        gap: 0.8rem;
      }

      .signupbutton button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="signup">
      <h1>Sign Up</h1>
      <form>
        <div class="infos">
          <div class="namein">
            <i class="fa-solid fa-user"></i>
            <label for="fullname">Full Name</label>
          </div>
          <input type="text" id="fullname" name="fullname" placeholder="Enter full name" required>
        </div>
        <div class="infos">
          <div class="namein">
            <i class="fa-solid fa-envelope"></i>
            <label for="phoneOrEmail">Phone or Email</label>
          </div>
          <input type="text" id="phoneOrEmail" name="phoneOrEmail" placeholder="Enter phone or email" required>
        </div>
        <div class="infos">
          <div class="namein">
            <i class="fa-solid fa-lock"></i>
            <label for="password">Password</label>
          </div>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
        <div class="terms">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
        </div>
        <div class="signupbutton">
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" id="signupBtn">Sign Up</button>
        </div>
      </form>
      <div class="loginlink">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
</body>
</html>
