<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Amaranth&family=Squada+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #fffaf1 0%, #ffe5ad 25%, white 50%, #f7e4c0 75%);
      background-size: 300% 300%; /* large enough for smooth vertical animation */
      animation: gradientBG 13s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 80px;
      box-sizing: border-box;
    }

    .left-section,
    .right-section {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .left-section {
      gap: 40px;
      margin-left: 120px;
      margin-top: 30px;
    }

    .clock {
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background-color: #ea7a80;
      position: relative;
      box-shadow: 0 0 20px 10px #fee5a6;
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background-color: #cfe2f0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
    }

    .hand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-origin: 0% 50%;
      background-color: #cfe2f0;
      border-radius: 6px;
      transition: transform 0.05s ease-in-out;
    }

    .hour {
      width: 25%;
      height: 6px;
      z-index: 3;
    }

    .minute {
      width: 35%;
      height: 4px;
      z-index: 2;
    }

    .second {
      width: 45%;
      height: 2px;
      background-color: #cfe2f0;
      z-index: 1;
    }

    .clock::before,
    .clock::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 20px;
      background-color: #cfe2f0;
      left: 50%;
      transform: translateX(-50%);
    }

    .clock::before { top: 0; }
    .clock::after { bottom: 0; }

    .line-left,
    .line-right {
      position: absolute;
      width: 20px;
      height: 6px;
      background-color: #cfe2f0;
      top: 50%;
      transform: translateY(-50%);
    }

    .line-left { left: 0; }
    .line-right { right: 0; }

    .time {
      font-size: 72px;
      font-family: 'Squada One', cursive;
      font-weight: normal;
      color: #91a6ce;
    }

    .date {
      font-size: 33px;
      font-family: 'Amaranth', sans-serif;
      color: #879073;
      text-align: center;
      margin-top: -35px;
    }

    .right-section {
      background-color: #bed3e1;
      padding: 60px 50px;
      gap: 20px;
      width: 520px;
      border-radius: 52% 40% 60% 40% / 30% 60% 40% 50%;
      justify-content: center;
      height: 90%;
      margin-left: 100px;
    }

    .nav-button {
      width: 70%;
      padding: 8px;
      border: none;
      border-radius: 30px;
      background-color: #fea997;
      color: #879073;
      font-size: 22px;
      font-family: 'Amaranth', sans-serif;
      cursor: pointer;
      transition: background-color 0.3s;
      display: block;
      text-align: center;
      text-decoration: none;
    }

    .nav-button:hover {
      color: #ffe5ad;
      border: 4px solid #ffe5ad;
      font-weight: bold;
    }

    .socials {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .socials i {
      font-size: 24px;
      color: #bed3e1;
      background-color: #879073;
      padding: 6px;
      border-radius: 8px;
      width: 25px;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
        gap: 30px;
      }

      .right-section {
        max-width: 90%;
        width: 100%;
        border-radius: 30px;
        height: auto;
      }

      .clock {
        width: 280px;
        height: 280px;
      }

      .time {
        font-size: 48px;
      }

      .date {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="left-section">
    <div class="clock">
      <div class="hand hour"></div>
      <div class="hand minute"></div>
      <div class="hand second"></div>
      <div class="line-left"></div>
      <div class="line-right"></div>
      <div class="center-circle"></div>
    </div>
    <div class="time">8:20 PM</div>
    <div class="date">SATURDAY APRIL 29, 2025</div>
  </div>

  <div class="right-section">
    <a href="home.html" class="nav-button">Home</a>
    <a href="about-us.html" class="nav-button">About Us</a>
    <a href="gallery.html" class="nav-button">Gallery</a>
    <a href="shop.html" class="nav-button">Shop</a>
    <a href="profile.html" class="nav-button">Profile</a>
    <a href="contact-us.html" class="nav-button">Contact Us</a>
    <div class="socials">
      <a href="https://www.facebook.com/QueenPiaaaa" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.x.com/woorilee22?s=21" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="https://www.instagram.com/iiiknit/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://www.pinterest.com/zlrehcx" aria-label="Pinterest"><i class="fab fa-pinterest"></i></a>
      <a href="mailto:theaaaaaa10@gmail.com" aria-label="Gmail"><i class="fas fa-envelope"></i></a>
    </div>
  </div>

  <audio id="background-audio" autoplay loop muted>
    <source src="lofi music 1hr.mp3" type="audio/mp3">
  </audio>

  <script>
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = (minutes / 60) * 360 + (seconds / 60) * 6;
      const hourDeg = (hours / 12) * 360 + (minutes / 60) * 30;

      document.querySelector('.second').style.transform = `rotate(${secondDeg}deg)`;
      document.querySelector('.minute').style.transform = `rotate(${minuteDeg}deg)`;
      document.querySelector('.hour').style.transform = `rotate(${hourDeg}deg)`;

      document.querySelector('.time').textContent = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });

      document.querySelector('.date').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      }).toUpperCase();
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Music autoplay/unmute logic
    const audio = document.getElementById('background-audio');
      if (audio) {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              setTimeout(() => {
                audio.muted = false;
              }, 500);
            })
            .catch((error) => {
              document.addEventListener('click', () => {
                audio.play().then(() => {
                  audio.muted = false;
                }).catch((err) => {
                  console.error('Error playing audio after interaction:', err);
                });
              }, { once: true });
            });
        }
      }
  </script>
</body>
</html>
